<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thuprai Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">thuprai</div>
        <div class="nav-right">
            <button class="login-btn">Login</button>
        </div>
    </header>

    <section class="genre-section">
        <h2>Browse Books by Genre</h2>
        <div class="genre-grid">
            <div class="genre-item">Fiction</div>
            <div class="genre-item">Short Stories</div>
            <div class="genre-item">Travel</div>
            <div class="genre-item">History</div>
            <div class="genre-item">Biography & Memoirs</div>
            <div class="genre-item">Literature/Essays</div>
            <div class="genre-item">Poetry</div>
            <div class="genre-item">Health & Fitness</div>
        </div>
    </section>

    <section class="new-releases">
        <div class="section-header">
            <h2>New Releases</h2>
            <button class="view-all">View All</button>
        </div>
        
        <div class="book-grid">
            <div class="book-card">
                <img src="images/book1.jpg" alt="Book 1">
                <p class="book-title">डङ्गी</p>
            </div>
            <div class="book-card">
                <img src="images/book2.jpg" alt="Book 2">
                <p class="book-title">औसत एउटा जिन्दगी</p>
            </div>
            <div class="book-card">
                <img src="images/book3.jpg" alt="Book 3">
                <p class="book-title">Crack in the Wind</p>
            </div>
            <div class="book-card">
                <img src="images/book4.jpg" alt="Book 4">
                <p class="book-title">मङ्गली कुसुम</p>
            </div>
        </div>
    </section>

</body>
</html>
